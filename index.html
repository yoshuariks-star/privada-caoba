<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d2e">
<title>Privada Caoba · Portal vecinal</title>
<style>
:root{--g9:#0b2e22;--g8:#0f3d2e;--g6:#1f6b4f;--g4:#3f9a77;--g1:#e3f1ea;--bg:#f5f7f4;--card:#fff;--tx:#14251d;--mu:#66786e;--bd:#dfe7e2;--ok:#1f8a5b;--warn:#c98a10;--bad:#c0392b;--r:14px;--sf:Georgia,"Times New Roman",serif;--sn:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body.dark{--bg:#0d1a14;--card:#14271e;--tx:#e8f2ec;--mu:#91a89b;--bd:#23392e;--g1:#1b3a2d}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--sn);background:var(--bg);color:var(--tx);font-size:15px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--sf);font-weight:700}
:focus-visible{outline:2px solid var(--g4);outline-offset:2px}
.hide{display:none!important}
/* login */
#login{min-height:100%;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,#1f6b4f 0,transparent 45%),linear-gradient(160deg,var(--g9),var(--g8))}
.lbox{background:#fff;color:#14251d;width:100%;max-width:400px;border-radius:20px;padding:34px 28px;box-shadow:0 30px 70px #0008}
.lbox h1{font-size:30px;letter-spacing:.5px;color:var(--g8);text-align:center}
.lbox p.sl{text-align:center;color:#66786e;font-style:italic;font-family:var(--sf);margin:6px 0 24px}
.fld{display:block;margin-bottom:14px;font-size:13px;color:var(--mu)}
.fld input,.fld select,.fld textarea{display:block;width:100%;margin-top:5px;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:16px}
.btn{background:var(--g8);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:600}
.btn:hover{background:var(--g6)}
.btn.sec{background:var(--g1);color:var(--g8)}
body.dark .btn.sec{color:#cfe9dc}
.btn.bad{background:#fbe7e4;color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.full{width:100%;padding:13px}
.hint{font-size:12px;color:#66786e;text-align:center;margin-top:14px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin:4px 0 18px;color:var(--mu)}
/* layout */
#app{display:flex;min-height:100%}
#side{width:250px;background:linear-gradient(180deg,var(--g9),var(--g8));color:#d6e9df;padding:22px 14px;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:30;overflow:auto}
.brand{font-family:var(--sf);font-size:21px;color:#fff;padding:0 10px 18px;letter-spacing:.5px}
.brand small{display:block;font:12px var(--sn);color:#9cc4b2;margin-top:3px;letter-spacing:0}
.nv{display:flex;gap:11px;align-items:center;width:100%;background:none;border:0;color:inherit;text-align:left;padding:11px 12px;border-radius:10px;font-size:15px}
.nv:hover{background:#ffffff14}
.nv.on{background:#fff;color:var(--g8);font-weight:600}
.me{margin-top:auto;padding:14px 10px 0;border-top:1px solid #ffffff22;font-size:13px}
.me b{display:block;color:#fff}
#main{margin-left:250px;flex:1;min-width:0}
#top{display:flex;align-items:center;gap:12px;padding:14px 26px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:20;padding-top:max(14px,env(safe-area-inset-top))}
#top h2{font-size:22px;flex:1}
#burger{display:none;background:none;border:0;font-size:24px}
.role{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--g1);color:var(--g8)}
body.dark .role{color:#cfe9dc}
#view{padding:26px;max-width:1200px;padding-bottom:calc(26px + env(safe-area-inset-bottom))}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1.5fr 1fr}.ge{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:20px;min-width:0}
.card h3{font-size:17px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi small{color:var(--mu);font-size:13px}
.kpi .v{font-family:var(--sf);font-size:30px;margin-top:6px}
.kpi.main{background:linear-gradient(135deg,var(--g8),var(--g6));color:#fff;border:0}.kpi.main small{color:#bfe0d0}
.up{color:var(--ok)}.dn{color:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.row .s{color:var(--mu);font-size:13px}
.tag{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.t-ok{background:#dff3e8;color:#14704a}.t-warn{background:#fbf0d3;color:#8a5d00}.t-bad{background:#fbe1dd;color:#a3281b}.t-n{background:var(--g1);color:var(--g8)}
.tb{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:520px}
th{text-align:left;font-size:13px;color:var(--mu);font-weight:500;padding:10px 8px;border-bottom:1px solid var(--bd)}
td{padding:12px 8px;border-bottom:1px solid var(--bd)}
.bar{height:10px;background:var(--g1);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g4)}
.tools{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.tools input,.tools select{flex:1;min-width:180px;padding:11px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);font-size:16px}
.ico{width:40px;height:40px;border-radius:11px;background:var(--g1);display:grid;place-items:center;font-size:19px;flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--bd);background:var(--card);padding:6px 13px;border-radius:99px;font-size:13px}.chip.on{background:var(--g8);color:#fff;border-color:var(--g8)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-top:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal b{font-size:12px;color:var(--mu);text-align:center;font-weight:500;padding:4px}
.day{min-height:72px;border:1px solid var(--bd);border-radius:9px;padding:5px;font-size:12px;overflow:hidden}
.day.td{border-color:var(--g4);background:var(--g1)}.day span{display:block;background:var(--g8);color:#fff;border-radius:5px;padding:1px 5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day span.p{background:var(--warn)}
.sw{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--bd);gap:10px}
.sw input{width:44px;height:24px;accent-color:var(--g6)}
.perm li{list-style:none;padding:5px 0;font-size:14px}.perm li:before{content:"✓ ";color:var(--ok);font-weight:700}.perm.no li:before{content:"✕ ";color:var(--bad)}
/* modal, toast */
#mod{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:16px;z-index:60}
.mb{background:var(--card);border-radius:18px;padding:24px;width:100%;max-width:440px;max-height:90vh;overflow:auto}.mb h3{margin-bottom:14px;font-size:20px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--g9);color:#fff;padding:12px 20px;border-radius:12px;z-index:90;font-size:14px;box-shadow:0 10px 30px #0006;max-width:90vw}
#wm{position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.09}
.back{background:none;border:0;color:var(--g6);font-weight:600;margin-bottom:12px;padding:0}
.ok-note{font-size:12px;color:var(--mu);margin-top:12px}
@media(max-width:980px){.g4{grid-template-columns:1fr 1fr}.g3,.g2,.ge{grid-template-columns:1fr}}
@media(max-width:820px){#side{transform:translateX(-100%);transition:transform .25s}#side.open{transform:none;box-shadow:0 0 0 100vw #0007}#main{margin-left:0}#burger{display:block}#top{padding:12px 16px}#top h2{font-size:19px}#view{padding:16px}.role{display:none}.kpi .v{font-size:25px}.day{min-height:54px;font-size:11px}.day span{font-size:10px;padding:0 3px}}
@media(max-width:420px){.g4{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section id="login">
  <form class="lbox" id="lf">
    <h1>🌿 PRIVADA CAOBA</h1>
    <p class="sl">“Juntos mantenemos nuestro hogar.”</p>
    <label class="fld">Usuario o correo<input id="lu" autocomplete="username" placeholder="admin, torres24, lopez21…" required></label>
    <label class="fld">Contraseña<input id="lp" type="password" autocomplete="current-password" placeholder="Cualquier contraseña en la demo" required></label>
    <label class="chk"><input type="checkbox" checked> Recordarme</label>
    <button class="btn full" type="submit">Iniciar sesión</button>
    <p class="hint">Demo: escribe “admin” para ver todo, o “torres24” (o la casa que quieras) para ver la vista de vecino.</p>
  </form>
</section>

<div id="app" class="hide">
  <aside id="side"></aside>
  <div id="main">
    <header id="top"><button id="burger" aria-label="Menú">☰</button><h2 id="ttl"></h2><span class="role" id="rl"></span><button class="btn sec sm" id="bell">🔔 <span id="nb">3</span></button></header>
    <main id="view"></main>
  </div>
</div>
<div id="wm" class="hide"></div>
<div id="mod" class="hide"></div>
<div id="toast" class="hide"></div>

<script>
const $=s=>document.querySelector(s);
const M=n=>'$'+Number(n).toLocaleString('es-MX');
const S={user:null,admin:false,house:24,sec:'inicio',q:'',dcat:'Todos',rm:'2026-09',cal:new Date(2026,9,1),wm:true,det:null};
const meses=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const H=[
 {n:21,o:'Familia López',s:'Pagado',d:0,last:'29 Sep',p:24,u:'lopez21'},
 {n:22,o:'García Hernández',s:'Pagado',d:0,last:'28 Sep',p:22,u:'garcia22'},
 {n:23,o:'Ramírez Soto',s:'Pendiente',d:1200,last:'15 Jul',p:15,u:'ramirez23'},
 {n:24,o:'Torres Martínez',s:'Parcial',d:1200,last:'15 Sep',p:18,u:'torres24'},
 {n:25,o:'Pérez Díaz',s:'Pagado',d:0,last:'27 Sep',p:20,u:'perez25'},
 {n:26,o:'Sánchez Ruiz',s:'Pagado',d:0,last:'26 Sep',p:19,u:'sanchez26'},
 {n:27,o:'Flores Vega',s:'Pendiente',d:1000,last:'15 Aug',p:16,u:'flores27'},
 {n:28,o:'Castillo Mora',s:'Pagado',d:0,last:'25 Sep',p:21,u:'castillo28'}];
const MV=[['29 Sep','Cuota mantenimiento · Casa 21',500,'Ingreso'],['29 Sep','Cuota mantenimiento · Casa 22',500,'Ingreso'],['28 Sep','Luz áreas comunes',1280,'Gasto'],['27 Sep','Jardinería',2000,'Gasto'],['26 Sep','Cuota mantenimiento · Casa 25',500,'Ingreso'],['24 Sep','Vigilancia',5200,'Gasto'],['22 Sep','Limpieza',1870,'Gasto']];
const INC=[21000,22500,23800,24100,24600,25000],EXP=[11200,9800,13400,10900,12100,12350],MN=['Abr','May','Jun','Jul','Ago','Sep'];
const DIST=[['Vigilancia',5200,'#0f3d2e'],['Jardinería',2000,'#3f9a77'],['Luz',1280,'#c98a10'],['Limpieza',1870,'#8fc9ae'],['Otros',2000,'#9aa59f']];
let AV=[{i:'🔧',t:'Mantenimiento de áreas comunes',f:'2026-10-03',h:'09:00–13:00',d:'Se podará el jardín y se revisará la bomba de agua.'},{i:'📅',t:'Asamblea general',f:'2026-10-15',h:'19:00',d:'Presupuesto 2027 y votación de mejoras en la caseta.'},{i:'💧',t:'Corte de agua',f:'2026-10-08',h:'08:00–12:00',d:'Corte programado por reparación de tubería principal.'}];
let DOCS=[['Reglamentos','Reglamento interno','PDF · 1.2 MB'],['Actas','Acta de asamblea 2025','PDF · 640 KB'],['Facturas','Facturas de servicios','PDF · 2.8 MB'],['Cotizaciones','Cotizaciones mantenimiento','PDF · 900 KB'],['Comprobantes','Comprobante Casa 21 · Sep','PDF · 210 KB'],['Otros','Plano de áreas comunes','PDF · 4.1 MB']];
const LOG=[['Administrador','iPhone','hoy 19:42'],['Casa 24','Safari','hoy 18:15'],['Casa 21','Chrome','hoy 16:03'],['Casa 22','Safari','ayer 21:30'],['Casa 25','Chrome','ayer 10:12']];
const EV=[['2026-10-03','🔧','Mantenimiento'],['2026-10-08','💧','Corte de agua'],['2026-10-15','📅','Asamblea'],['2026-10-24','🎉','Convivencia vecinal']];
const NAV=[['inicio','🏠','Inicio'],['finanzas','💰','Finanzas'],['vecinos','🏘️','Vecinos',1],['pagos','🧾','Pagos',1],['mipagos','🧾','Mis pagos',0,1],['avisos','📣','Avisos'],['docs','📁','Documentos'],['cuentas','👥','Cuentas',1],['reportes','📊','Reportes',1],['cal','📅','Calendario'],['config','⚙️','Configuración']];
const TT={inicio:'Inicio',finanzas:'Finanzas',vecinos:'Vecinos',pagos:'Pagos',mipagos:'Mis pagos',avisos:'Avisos',docs:'Documentos',cuentas:'Cuentas y permisos',reportes:'Reportes',cal:'Calendario',config:'Configuración'};

function toast(t){const e=$('#toast');e.textContent=t;e.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hide'),2600)}
function modal(h){const m=$('#mod');m.innerHTML='<div class="mb">'+h+'</div>';m.classList.remove('hide')}
function closeM(){$('#mod').classList.add('hide')}
$('#mod').onclick=e=>{if(e.target.id==='mod')closeM()};
const tag=s=>'<span class="tag '+({Pagado:'t-ok',Pendiente:'t-bad',Parcial:'t-warn',Ingreso:'t-ok',Gasto:'t-bad',Activa:'t-ok'}[s]||'t-n')+'">'+s+'</span>';
const hh=n=>H.find(x=>x.n==n);

/* login */
$('#lf').onsubmit=e=>{e.preventDefault();const u=$('#lu').value.trim().toLowerCase();
 S.user=u;S.admin=/^admin/.test(u);const d=u.match(/\d+/);S.house=d&&hh(d[0])?+d[0]:24;
 $('#login').classList.add('hide');$('#app').classList.remove('hide');S.sec='inicio';go('inicio');toast('Bienvenido, '+(S.admin?'Administrador':'Casa '+S.house))};
function logout(){S.user=null;$('#app').classList.add('hide');$('#wm').classList.add('hide');$('#login').classList.remove('hide')}

/* nav */
function go(s){S.sec=s;S.det=null;$('#side').classList.remove('open');render()}
function render(){
 const side=$('#side');
 side.innerHTML='<div class="brand">🌿 PRIVADA CAOBA<small>Portal vecinal</small></div>'+NAV.filter(n=>S.admin?!n[4]:!n[3]).map(n=>`<button class="nv ${S.sec===n[0]?'on':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('')+
 `<div class="me"><b>${S.admin?'Administrador':'Casa '+S.house+' · '+hh(S.house).o}</b>${S.user}<br><button class="btn sec sm" style="margin-top:10px" onclick="logout()">Cerrar sesión</button></div>`;
 $('#ttl').textContent=TT[S.sec];$('#rl').textContent=S.admin?'Administrador':'Vecino';
 $('#view').innerHTML=S.det?vDet(S.det):V[S.sec]();
 watermark();window.scrollTo(0,0);if(V[S.sec+'_'])V[S.sec+'_']();
}
$('#burger').onclick=()=>$('#side').classList.toggle('open');
$('#bell').onclick=()=>{$('#nb').textContent='0';go('avisos')};
function watermark(){const w=$('#wm'),t='PRIVADA CAOBA · '+(S.admin?'ADMIN':'CASA '+S.house);
 if(!S.wm||!S.user){w.classList.add('hide');return}
 const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='300' height='190'><text x='20' y='110' transform='rotate(-25 150 95)' font-family='Arial' font-size='15' font-weight='700' fill='#0f3d2e'>${t}</text></svg>`;
 w.style.background="url(\"data:image/svg+xml,"+encodeURIComponent(svg)+"\")";w.classList.remove('hide')}

/* charts */
function bars(){const W=560,Hh=220,mx=30000,bw=16;let s=`<svg viewBox="0 0 ${W} ${Hh+28}" width="100%" role="img" aria-label="Ingresos y gastos por mes">`;
 [0,10000,20000,30000].forEach(v=>{const y=Hh-v/mx*Hh;s+=`<line x1="44" x2="${W}" y1="${y}" y2="${y}" stroke="var(--bd)"/><text x="0" y="${y+4}" font-size="11" fill="var(--mu)">${v/1000}k</text>`});
 MN.forEach((m,i)=>{const x=64+i*84,a=INC[i]/mx*Hh,b=EXP[i]/mx*Hh;
  s+=`<rect x="${x}" y="${Hh-a}" width="${bw}" height="${a}" rx="4" fill="#1f6b4f"><title>${m}: ingresos ${M(INC[i])}</title></rect><rect x="${x+bw+4}" y="${Hh-b}" width="${bw}" height="${b}" rx="4" fill="#c98a10"><title>${m}: gastos ${M(EXP[i])}</title></rect><text x="${x+bw}" y="${Hh+18}" font-size="12" fill="var(--mu)" text-anchor="middle">${m}</text>`});
 return s+'</svg><div class="legend"><span><i style="background:#1f6b4f"></i>Ingresos</span><span><i style="background:#c98a10"></i>Gastos</span></div>'}
function donut(){const t=DIST.reduce((a,b)=>a+b[1],0);let a=0,s='<svg viewBox="0 0 42 42" width="170" style="flex:none"><circle cx="21" cy="21" r="15.9" fill="none" stroke="var(--g1)" stroke-width="7"/>';
 DIST.forEach(d=>{const p=d[1]/t*100;s+=`<circle cx="21" cy="21" r="15.9" fill="none" stroke="${d[2]}" stroke-width="7" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${25-a}"><title>${d[0]} ${M(d[1])}</title></circle>`;a+=p});
 return '<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">'+s+'</svg><div style="flex:1;min-width:150px">'+DIST.map(d=>`<div class="row" style="padding:6px 0"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${d[2]};margin-right:8px"></i>${d[0]}</span><b>${M(d[1])}</b></div>`).join('')+'</div></div>'}
const kpi=(l,v,x,c)=>`<div class="card kpi ${c||''}"><small>${l}</small><div class="v">${v}</div>${x?`<small>${x}</small>`:''}</div>`;
const mvRows=a=>a.map(m=>`<div class="row"><div><b>${m[1]}</b><div class="s">${m[0]}</div></div><div style="text-align:right"><b class="${m[3]=='Ingreso'?'up':'dn'}">${m[3]=='Ingreso'?'+':'−'}${M(m[2])}</b><div>${tag(m[3])}</div></div></div>`).join('');
const avRows=a=>a.map(v=>`<div class="row"><div style="display:flex;gap:12px;align-items:center"><div class="ico">${v.i}</div><div><b>${v.t}</b><div class="s">${fd(v.f)} · ${v.h}</div></div></div></div>`).join('');
const fd=f=>{const d=f.split('-');return +d[2]+' '+meses[d[1]-1]};

const V={};
V.inicio=()=>{
 const me=hh(S.house);
 const top=S.admin?`<div class="grid g4">${kpi('Saldo disponible','$38,450','▲ 4.2% vs mes anterior','main')}${kpi('Ingresos del mes','$25,000')}${kpi('Gastos del mes','$12,350')}${kpi('Cuotas pagadas','42 / 50','<div class="bar" style="margin-top:8px"><i style="width:84%"></i></div>')}</div>`:
 `<div class="grid g4">${kpi('Mi estado','Casa '+me.n,me.o+' · '+me.s,'main')}${kpi('Mi deuda',M(me.d))}${kpi('Saldo de la privada','$38,450')}${kpi('Próximo aviso','3 Oct','Mantenimiento')}</div>`;
 return top+`<div class="grid g2" style="margin-top:16px"><div class="card"><h3>Ingresos y gastos</h3>${bars()}</div><div class="card"><h3>Actividad reciente</h3>
 ${[['💵','Casa 24 registró un pago','$500'],['📣','Nuevo aviso publicado','Mantenimiento'],['🧾','Factura agregada','Luz'],['⏳','Casa 23 pendiente','$1,200']].map(a=>`<div class="row"><div style="display:flex;gap:10px;align-items:center"><div class="ico">${a[0]}</div>${a[1]}</div><b>${a[2]}</b></div>`).join('')}</div></div>
 <div class="grid ge" style="margin-top:16px"><div class="card"><h3>Cuotas <button class="btn sec sm" onclick="go('${S.admin?'vecinos':'mipagos'}')">Ver todo</button></h3>${(S.admin?H.slice(0,4):[me]).map(h=>`<div class="row"><b>Casa ${h.n}</b>${tag(h.s)}<b>${M(h.s=='Pagado'?500:h.d)}</b></div>`).join('')}</div>
 <div class="card"><h3>Avisos <button class="btn sec sm" onclick="go('avisos')">Ver todo</button></h3>${avRows(AV.slice(0,2))}</div></div>`};
V.finanzas=()=>`<div class="grid g4">${kpi('Saldo actual','$38,450','','main')}${kpi('Ingresos','$25,000')}${kpi('Gastos','$12,350')}${kpi('Saldo inicial','$25,800')}</div>
 <div class="grid g2" style="margin-top:16px"><div class="card"><h3>Movimientos por mes</h3>${bars()}</div><div class="card"><h3>Distribución de gastos</h3>${donut()}</div></div>
 <div class="card" style="margin-top:16px"><h3>Historial de movimientos ${S.admin?'<button class="btn sm" onclick="addGasto()">+ Agregar gasto</button>':''}</h3><div id="mvl">${mvRows(MV)}</div>${S.admin?'':'<p class="ok-note">🔒 Vista de solo lectura: los vecinos no pueden modificar las finanzas.</p>'}</div>`;
function addGasto(){modal(`<h3>Agregar gasto</h3><label class="fld">Concepto<input id="gc" placeholder="Ej. Reparación de portón"></label><label class="fld">Monto<input id="gm" type="number" inputmode="numeric" placeholder="1500"></label><div class="acts"><button class="btn sec" onclick="closeM()">Cancelar</button><button class="btn" onclick="saveGasto()">Guardar gasto</button></div>`)}
function saveGasto(){const c=$('#gc').value.trim(),m=+$('#gm').value;if(!c||!m)return toast('Completa concepto y monto');MV.unshift(['30 Sep',c,m,'Gasto']);closeM();toast('Gasto guardado');render()}
V.vecinos=()=>`<div class="tools"><input id="sq" placeholder="🔎 Buscar casa o propietario…" value="${S.q}" oninput="S.q=this.value;vlist()"><button class="btn" onclick="addCasa()">+ Agregar casa</button></div><div class="card"><div class="tb"><table><thead><tr><th>Casa</th><th>Responsable</th><th>Estado</th><th>Último pago</th><th></th></tr></thead><tbody id="vb"></tbody></table></div></div>`;
V.vecinos_=()=>vlist();
function vlist(){const q=S.q.toLowerCase();const a=H.filter(h=>('casa '+h.n+' '+h.o).toLowerCase().includes(q));$('#vb').innerHTML=a.length?a.map(h=>`<tr><td><b>Casa ${h.n}</b></td><td>${h.o}</td><td>${tag(h.s)}</td><td>${h.last}</td><td><button class="btn sec sm" onclick="S.det=${h.n};render()">Ver detalles</button></td></tr>`).join(''):'<tr><td colspan="5">Sin resultados. Prueba con otro número o apellido.</td></tr>'}
function addCasa(){modal(`<h3>Agregar casa</h3><label class="fld">Número de casa<input id="cn" type="number" inputmode="numeric" placeholder="29"></label><label class="fld">Responsable<input id="co" placeholder="Familia Romero"></label><div class="acts"><button class="btn sec" onclick="closeM()">Cancelar</button><button class="btn" onclick="saveCasa()">Agregar casa</button></div>`)}
function saveCasa(){const n=+$('#cn').value,o=$('#co').value.trim();if(!n||!o)return toast('Completa número y responsable');if(hh(n))return toast('Esa casa ya existe');H.push({n,o,s:'Pendiente',d:500,last:'—',p:0,u:o.split(' ').pop().toLowerCase()+n});closeM();toast('Casa '+n+' agregada');render()}
function vDet(n){const h=hh(n);return `${S.admin?'<button class="back" onclick="S.det=null;render()">← Volver a vecinos</button>':''}
 <div class="card" style="margin-bottom:16px"><h3 style="font-size:24px">Casa ${h.n} · ${h.o} ${tag(h.s)}</h3>
 <div class="grid g4">${kpi('Deuda',M(h.d),'','')}${kpi('Fecha límite','5 Oct')}${kpi('Pagos',h.p)}${kpi('Estado',h.s)}</div>
 <div class="acts" style="justify-content:flex-start;margin-top:16px">${S.admin?`<button class="btn" onclick="regPago(${h.n})">Registrar pago</button>`:''}<button class="btn sec" onclick="toast('Abriendo comprobantes de la Casa ${h.n}…')">Comprobantes</button>${S.admin?`<button class="btn sec" onclick="toast('Aviso enviado a Casa ${h.n}')">Enviar aviso</button>`:''}</div></div>
 <div class="card"><h3>Historial de pagos</h3>${['15 Sep','15 Ago','15 Jul'].map(f=>`<div class="row"><div><b>Mantenimiento</b><div class="s">${f}</div></div><div style="text-align:right"><b>$500</b><div>${tag('Pagado')}</div></div></div>`).join('')}</div>`}
V.mipagos=()=>vDet(S.house);
function regPago(n){modal(`<h3>Registrar pago · Casa ${n}</h3><label class="fld">Monto<input id="pm" type="number" inputmode="numeric" value="${hh(n).d||500}"></label><label class="fld">Método<select><option>Transferencia</option><option>Efectivo</option><option>Depósito</option></select></label><div class="acts"><button class="btn sec" onclick="closeM()">Cancelar</button><button class="btn" onclick="savePago(${n})">Registrar pago</button></div>`)}
function savePago(n){const h=hh(n),m=+$('#pm').value;if(!m)return toast('Ingresa un monto');h.d=Math.max(0,h.d-m);h.s=h.d?'Parcial':'Pagado';h.p++;h.last='30 Sep';MV.unshift(['30 Sep','Cuota mantenimiento · Casa '+n,m,'Ingreso']);closeM();toast('Pago de '+M(m)+' registrado');render()}
V.pagos=()=>{const pend=H.filter(h=>h.d>0);return `<div class="grid g4">${kpi('Por cobrar',M(pend.reduce((a,h)=>a+h.d,0)))}${kpi('Pagos del mes','$25,000')}${kpi('Comprobantes','38')}${kpi('Vencidos',pend.filter(h=>h.s=='Pendiente').length)}</div>
 <div class="card" style="margin-top:16px"><h3>Control de pagos</h3><div class="tb"><table><thead><tr><th>Casa</th><th>Responsable</th><th>Monto</th><th>Estado</th><th>Acción</th></tr></thead><tbody>${H.map(h=>`<tr><td><b>Casa ${h.n}</b></td><td>${h.o}</td><td>${M(h.d||500)}</td><td>${tag(h.s)}</td><td>${h.d?`<button class="btn sm" onclick="toast('Recordatorio enviado a Casa ${h.n}')">Cobrar</button> <button class="btn sec sm" onclick="regPago(${h.n})">Registrar</button>`:'<button class="btn sec sm" onclick="toast(\'Comprobante descargado\')">Comprobante</button>'}</td></tr>`).join('')}</tbody></table></div></div>`};
V.avisos=()=>`<div class="tools"><span style="flex:1"></span>${S.admin?'<button class="btn" onclick="avForm()">+ Nuevo aviso</button>':''}</div><div class="grid g2" style="grid-template-columns:repeat(auto-fill,minmax(290px,1fr))">${AV.map((v,i)=>`<div class="card"><div style="display:flex;gap:12px;align-items:center;margin-bottom:10px"><div class="ico">${v.i}</div><h3 style="margin:0;font-size:17px">${v.t}</h3></div><p style="color:var(--mu)">${v.d}</p><p style="margin:10px 0"><b>📆 ${fd(v.f)} · 🕐 ${v.h}</b></p>${S.admin?`<button class="btn sec sm" onclick="avForm(${i})">Editar aviso</button> <button class="btn bad sm" onclick="AV.splice(${i},1);toast('Aviso eliminado');render()">Eliminar</button>`:''}</div>`).join('')}</div>`;
function avForm(i){const v=i==null?{i:'📣',t:'',f:'2026-10-20',h:'10:00',d:''}:AV[i];modal(`<h3>${i==null?'Nuevo aviso':'Editar aviso'}</h3><label class="fld">Tipo<select id="ai">${['🔧','📅','💧','📣','🎉'].map(e=>`<option ${e==v.i?'selected':''}>${e}</option>`).join('')}</select></label><label class="fld">Título<input id="at" value="${v.t}"></label><label class="fld">Fecha<input id="af" type="date" value="${v.f}"></label><label class="fld">Hora<input id="ah" value="${v.h}"></label><label class="fld">Descripción<textarea id="ad" rows="3">${v.d}</textarea></label><div class="acts"><button class="btn sec" onclick="closeM()">Cancelar</button><button class="btn" onclick="avSave(${i==null?-1:i})">Publicar aviso</button></div>`)}
function avSave(i){const v={i:$('#ai').value,t:$('#at').value.trim(),f:$('#af').value,h:$('#ah').value,d:$('#ad').value};if(!v.t||!v.f)return toast('Agrega título y fecha');i<0?AV.unshift(v):AV[i]=v;closeM();toast('Aviso publicado');render()}
const CATS=['Todos','Reglamentos','Actas','Facturas','Cotizaciones','Comprobantes','Otros'];
V.docs=()=>`<div class="tools"><div class="chips" style="margin:0;flex:1">${CATS.map(c=>`<button class="chip ${S.dcat==c?'on':''}" onclick="S.dcat='${c}';render()">${c}</button>`).join('')}</div>${S.admin?'<button class="btn" onclick="upDoc()">⬆ Subir documento</button>':''}</div>
 <div class="card">${DOCS.map((d,i)=>[d,i]).filter(x=>S.dcat=='Todos'||x[0][0]==S.dcat).map(([d,i])=>`<div class="row"><div style="display:flex;gap:12px;align-items:center"><div class="ico">📄</div><div><b>${d[1]}</b><div class="s">${d[0]} · ${d[2]}</div></div></div><div><button class="btn sec sm" onclick="toast('Abriendo “${d[1]}” con marca de agua…')">Ver</button> <button class="btn sec sm" onclick="toast('Descarga iniciada')">Descargar</button>${S.admin?` <button class="btn bad sm" onclick="DOCS.splice(${i},1);toast('Documento eliminado');render()">Eliminar</button>`:''}</div></div>`).join('')||'<p>No hay documentos en esta categoría.</p>'}</div><p class="ok-note">Los documentos se muestran con marca de agua personalizada para desalentar la difusión de capturas.</p>`;
function upDoc(){modal(`<h3>Subir documento</h3><label class="fld">Nombre<input id="dn" placeholder="Acta de asamblea 2026"></label><label class="fld">Categoría<select id="dc">${CATS.slice(1).map(c=>`<option>${c}</option>`).join('')}</select></label><div class="acts"><button class="btn sec" onclick="closeM()">Cancelar</button><button class="btn" onclick="saveDoc()">Subir documento</button></div>`)}
function saveDoc(){const n=$('#dn').value.trim();if(!n)return toast('Escribe un nombre');DOCS.unshift([$('#dc').value,n,'PDF · 1.0 MB']);closeM();toast('Documento subido');render()}
const PA=['Ver todo','Agregar y editar casas','Registrar pagos','Agregar gastos','Subir documentos','Crear avisos','Administrar cuentas','Ver reportes','Configurar el portal'],PV=['Ver sus pagos','Ver su deuda','Ver sus comprobantes','Ver avisos','Ver documentos autorizados','Ver información general'];
V.cuentas=()=>`<div class="grid ge"><div class="card perm"><h3>🛡️ Administrador</h3><ul>${PA.map(p=>`<li>${p}</li>`).join('')}</ul></div><div class="card perm"><h3>🏠 Vecino</h3><ul>${PV.map(p=>`<li>${p}</li>`).join('')}</ul><ul class="no" style="margin-top:8px"><li>Modificar finanzas</li><li>Ver datos de otras casas</li></ul></div></div>
 <div class="card" style="margin-top:16px"><h3>Cuentas <button class="btn sm" onclick="toast('Invitación enviada (demo)')">+ Nueva cuenta</button></h3><div class="tb"><table><thead><tr><th>Casa</th><th>Usuario</th><th>Rol</th><th>Estado</th><th></th></tr></thead><tbody><tr><td>—</td><td>admin</td><td>Administrador</td><td>${tag('Activa')}</td><td></td></tr>${H.map(h=>`<tr><td>Casa ${h.n}</td><td>${h.u}</td><td>Vecino</td><td>${tag('Activa')}</td><td><button class="btn sec sm" onclick="toast('Contraseña restablecida para ${h.u}')">Restablecer</button></td></tr>`).join('')}</tbody></table></div></div>
 <div class="card" style="margin-top:16px"><h3>Registro de accesos</h3>${LOG.map(l=>`<div class="row"><b>${l[0]}</b><span class="s">${l[1]}</span><span class="s">${l[2]}</span></div>`).join('')}</div>`;
V.reportes=()=>`<div class="tools"><select onchange="S.rm=this.value;render()">${[['2026-09','Septiembre 2026'],['2026-08','Agosto 2026'],['2026-07','Julio 2026']].map(m=>`<option value="${m[0]}" ${S.rm==m[0]?'selected':''}>${m[1]}</option>`).join('')}</select><button class="btn" onclick="toast('Generando PDF…')">Exportar PDF</button><button class="btn sec" onclick="toast('Generando Excel…')">Exportar Excel</button></div>${(()=>{const i={'2026-09':5,'2026-08':4,'2026-07':3}[S.rm],ing=INC[i],ga=EXP[i];return `<div class="grid g4">${kpi('Ingresos',M(ing))}${kpi('Gastos',M(ga))}${kpi('Resultado',M(ing-ga),'Superávit del mes','main')}${kpi('Cuotas cobradas',[42,41,40][5-i]+' / 50')}</div><div class="card" style="margin-top:16px"><h3>Distribución de gastos</h3>${donut()}</div>`})()}`;
V.cal=()=>{const c=S.cal,y=c.getFullYear(),m=c.getMonth(),off=(new Date(y,m,1).getDay()+6)%7,nd=new Date(y,m+1,0).getDate();let g=['L','M','M','J','V','S','D'].map(d=>`<b>${d}</b>`).join('')+'<i></i>'.repeat(off).replace(/<i><\/i>/g,'<div></div>');
 for(let d=1;d<=nd;d++){const k=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;g+=`<div class="day ${k=='2026-09-30'?'td':''}">${d}${EV.concat(AV.map(a=>[a.f,a.i,a.t])).filter(e=>e[0]==k).filter((e,i,a)=>a.findIndex(z=>z[0]==e[0]&&z[2]==e[2])==i).map(e=>`<span>${e[1]} ${e[2]}</span>`).join('')}${d==5?'<span class="p">💵 Fecha de pago</span>':''}</div>`}
 return `<div class="card"><h3><button class="btn sec sm" onclick="S.cal=new Date(${y},${m-1},1);render()">‹</button>${['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'][m]} ${y}<button class="btn sec sm" onclick="S.cal=new Date(${y},${m+1},1);render()">›</button></h3><div class="cal">${g}</div><div class="legend"><span><i style="background:var(--g8)"></i>Eventos</span><span><i style="background:var(--warn)"></i>Fechas de pago</span></div></div>`};
V.config=()=>`<div class="grid ge"><div class="card"><h3>Preferencias</h3>
 <div class="sw"><span>Tema oscuro</span><input type="checkbox" ${document.body.classList.contains('dark')?'checked':''} onchange="document.body.classList.toggle('dark',this.checked);toast(this.checked?'Tema oscuro activado':'Tema claro activado')"></div>
 <div class="sw"><span>Marca de agua personalizada<br><small class="s">PRIVADA CAOBA · ${S.admin?'ADMIN':'CASA '+S.house}</small></span><input type="checkbox" ${S.wm?'checked':''} onchange="S.wm=this.checked;watermark();toast('Marca de agua '+(this.checked?'activada':'desactivada'))"></div>
 <div class="sw"><span>Alertas al iniciar sesión</span><input type="checkbox" checked onchange="toast('Preferencia guardada')"></div>
 <div class="sw"><span>Cierre automático</span><select onchange="toast('Cierre en '+this.value)"><option>10 min</option><option>30 min</option><option>1 hora</option></select></div>
 <div class="sw"><span>Idioma</span><select onchange="toast('Idioma: '+this.value)"><option>Español</option><option>English</option></select></div>
 <div class="acts" style="justify-content:flex-start;margin-top:14px"><button class="btn" onclick="pwd()">Cambiar contraseña</button></div></div>
 <div class="card"><h3>Registro de accesos</h3>${LOG.map(l=>`<div class="row"><b>${l[0]}</b><span class="s">${l[1]}</span><span class="s">${l[2]}</span></div>`).join('')}<p class="ok-note">🔒 Esta demo no puede bloquear capturas de pantalla al 100%. Se desalienta con inicio de sesión individual, permisos, registro de accesos y marca de agua para identificar el origen de una captura.</p></div></div>`;
function pwd(){modal(`<h3>Cambiar contraseña</h3><label class="fld">Contraseña actual<input type="password"></label><label class="fld">Nueva contraseña<input type="password"></label><div class="acts"><button class="btn sec" onclick="closeM()">Cancelar</button><button class="btn" onclick="closeM();toast('Contraseña actualizada')">Guardar contraseña</button></div>`)}
</script>
</body>
</html>
